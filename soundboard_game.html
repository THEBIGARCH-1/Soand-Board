<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Soundboard Game & Creator Studio</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #2c3e50;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .search-container, .creator-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        #searchBar {
            width: 80%;
            max-width: 400px;
            padding: 10px 15px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 25px;
            outline: none;
            transition: 0.3s;
        }
        #searchBar:focus {
            border-color: #3498db;
        }
        .sound-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }
        .sound-btn {
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 20px 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s, background-color 0.2s;
        }
        .sound-btn.custom {
            background-color: #e67e22;
        }
        .sound-btn.custom:hover {
            background-color: #d35400;
        }
        .sound-btn:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .sound-btn:active {
            transform: translateY(1px);
        }
        .creator-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
            max-width: 600px;
            margin: 0 auto;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: span 2;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .creator-buttons {
            grid-column: span 2;
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }
        .action-btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }
        .action-btn.preview {
            background-color: #9b59b6;
        }
        .action-btn:hover {
            opacity: 0.9;
        }
        .hidden {
            display: none !important;
        }
        @media(max-width: 600px) {
            .creator-form {
                grid-template-columns: 1fr;
            }
            .form-group.full-width, .creator-buttons {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Soundboard Mini-Game & Studio</h1>
        <p>Search, play default sounds, or create and save your own unique audio effects!</p>

        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search sounds..." onkeyup="filterSounds()">
        </div>

        <div class="sound-grid" id="soundGrid">
            <button class="sound-btn" onclick="playPreset('pop')">Pop 🎈</button>
            <button class="sound-btn" onclick="playPreset('bell')">Bell 🔔</button>
            <button class="sound-btn" onclick="playPreset('laser')">Laser ⚡</button>
            <button class="sound-btn" onclick="playPreset('boing')">Boing 🌀</button>
            <button class="sound-btn" onclick="playPreset('click')">Click 🖱️</button>
            <button class="sound-btn" onclick="playPreset('success')">Success ⭐</button>
        </div>

        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

        <div class="creator-section">
            <h2>🎛️ Custom Sound Studio</h2>
            <div class="creator-form">
                <div class="form-group full-width">
                    <label for="soundName">Sound Name:</label>
                    <input type="text" id="soundName" placeholder="e.g., Cyber Jump, Alien Ray">
                </div>

                <div class="form-group">
                    <label for="waveType">Wave Shape (Tone Type):</label>
                    <select id="waveType">
                        <option value="sine">Sine (Smooth & Soft)</option>
                        <option value="triangle">Triangle (Flute-like)</option>
                        <option value="square">Square (Retro 8-Bit)</option>
                        <option value="sawtooth">Sawtooth (Buzzing/Sharp)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="duration">Duration (Seconds):</label>
                    <input type="number" id="duration" value="0.3" min="0.05" max="2.0" step="0.05">
                </div>

                <div class="form-group">
                    <label for="startFreq">Start Frequency (Hz):</label>
                    <input type="number" id="startFreq" value="440" min="50" max="3000">
                </div>

                <div class="form-group">
                    <label for="endFreq">End Frequency (Hz):</label>
                    <input type="number" id="endFreq" value="880" min="50" max="3000">
                </div>

                <div class="form-group">
                    <label for="volume">Volume:</label>
                    <input type="number" id="volume" value="0.3" min="0.01" max="1.0" step="0.05">
                </div>

                <div class="creator-buttons">
                    <button class="action-btn preview" onclick="previewCustomSound()">Preview 🎧</button>
                    <button class="action-btn" onclick="saveCustomSound()">Save to Board 💾</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Search filter function
        function filterSounds() {
            let input = document.getElementById('searchBar').value.toLowerCase();
            let buttons = document.getElementsByClassName('sound-btn');

            for (let i = 0; i < buttons.length; i++) {
                let text = buttons[i].innerText.toLowerCase();
                if (text.includes(input)) {
                    buttons[i].classList.remove('hidden');
                } else {
                    buttons[i].classList.add('hidden');
                }
            }
        }

        // Core Synthesizer engine using Web Audio API
        function generateSound(type, dur, startF, endF, vol) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            let now = audioCtx.currentTime;

            osc.type = type;
            osc.frequency.setValueAtTime(startF, now);
            osc.frequency.exponentialRampToValueAtTime(Math.max(endF, 1), now + dur);

            gainNode.gain.setValueAtTime(vol, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + dur);

            osc.start(now);
            osc.stop(now + dur);
        }

        // Play standard preset effects
        function playPreset(type) {
            if (type === 'pop') generateSound('sine', 0.1, 300, 800, 0.3);
            if (type === 'bell') generateSound('triangle', 0.8, 900, 900, 0.3);
            if (type === 'laser') generateSound('sawtooth', 0.2, 800, 100, 0.2);
            if (type === 'boing') generateSound('sine', 0.3, 150, 400, 0.3);
            if (type === 'click') generateSound('square', 0.05, 600, 600, 0.1);
            if (type === 'success') {
                generateSound('sine', 0.4, 440, 880, 0.2);
            }
        }

        // Gather parameters from the Studio inputs
        function getStudioParameters() {
            return {
                type: document.getElementById('waveType').value,
                dur: parseFloat(document.getElementById('duration').value),
                startF: parseFloat(document.getElementById('startFreq').value),
                endF: parseFloat(document.getElementById('endFreq').value),
                vol: parseFloat(document.getElementById('volume').value)
            };
        }

        // Preview sound without saving
        function previewCustomSound() {
            let p = getStudioParameters();
            generateSound(p.type, p.dur, p.startF, p.endF, p.vol);
        }

        // Save custom sound as a new interactive button on the board
        function saveCustomSound() {
            let nameInput = document.getElementById('soundName').value.trim();
            if (!nameInput) {
                alert("Please give your custom sound a name first!");
                return;
            }

            let p = getStudioParameters();
            let grid = document.getElementById('soundGrid');

            // Create new button element
            let newBtn = document.createElement('button');
            newBtn.className = 'sound-btn custom';
            newBtn.innerText = nameInput + " 🎛️";
            
            // Attach a closure function to play these exact saved parameters on click
            newBtn.onclick = function() {
                generateSound(p.type, p.dur, p.startF, p.endF, p.vol);
            };

            // Add to the main grid
            grid.appendChild(newBtn);

            // Clear the name input field for next time
            document.getElementById('soundName').value = "";
            alert("Success! Your custom sound has been added to the board.");
        }
    </script>

</body>
</html>
